      <stop offset="0%" stop-color="#F2C083"/>
      <stop offset="45%" stop-color="#E9A860"/>
      <stop offset="100%" stop-color="#B97F3F"/>
    </radialGradient>
    <filter id="sunBlur" x="-80%" y="-80%" width="260%" height="260%">
