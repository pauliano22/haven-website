  </defs>
  <rect width="900" height="480" fill="#111F1A"/>
  <text x="450" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="92" fill="#F4EEE1">Haven</text>
  <text x="450" y="184" text-anchor="middle" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#9CADA0">quiet, tuned to you</text>
